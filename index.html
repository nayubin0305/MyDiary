<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="나만의 작은 감정 일기장" />
    <meta name="theme-color" content="#000000" />
    <title>감정 일기장</title>
    <meta property="og:title" content="감정 일기장" />
    <meta property="og:description" content="나만의 작은 감정 일기장" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=calendar_month" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const theme = 
          saved === "light" || saved === "dark"
          ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        // 그냥 넘기기
      }
    </script>
  </head>
  <body>
    <noscript>이 앱을 사용하려면 JavaScript 설정을 켜 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
