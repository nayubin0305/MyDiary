<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="나만의 감정을 기록하고 통계로 돌아보는 감정 일기장" />
    <meta name="theme-color" content="#eaf4fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090c11" media="(prefers-color-scheme: dark)" />
    <title>감정 일기장</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="감정 일기장" />
    <meta property="og:description" content="나만의 감정을 기록하고 통계로 돌아보는 감정 일기장" />
    <meta property="og:url" content="https://my-diary-roan.vercel.app" />
    <meta property="og:image" content="https://my-diary-roan.vercel.app/thumbnail.jpg">
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=calendar_month" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const theme = 
          saved === "light" || saved === "dark"
          ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        // 그냥 넘기기
      }
    </script>
  </head>
  <body>
    <noscript>이 앱을 사용하려면 JavaScript 설정을 켜 주세요.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
